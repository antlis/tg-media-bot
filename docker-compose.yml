# Bot + local Telegram Bot API server (raises the upload limit from 50 MB to
# 2 GB). Both are capped so a heavy download can never take the VPS down —
# adjust the limits to your machine.
#
#   cp .env.example .env && nano .env
#   docker compose up -d --build
#   docker compose logs -f bot
#
# Without the local API server (50 MB limit, less RAM): remove the
# telegram-bot-api service and the API_SERVER_URL / LOCAL_API_SHARED_FILES
# lines below.

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "true"
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
      # Read-only view of the bot's downloads, at the same path as in the bot
      # container: the bot hands over file paths instead of streaming 2 GB
      # files to the server over HTTP.
      - bot-tmp:/data/tmp:ro
    # Not published on the host: only the bot talks to it.
    # Started after the bot so the shared bot-tmp volume is created with the
    # bot's ownership (the bot simply retries until this server is up).
    depends_on:
      - bot
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8081"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build: .
    image: tg-media-bot:local
    env_file: .env
    environment:
      API_SERVER_URL: http://telegram-bot-api:8081
      LOCAL_API_SHARED_FILES: "true"
      COOKIES_FILE: /cookies/cookies.txt
      PLUGIN_DIR: /plugins
    volumes:
      - bot-data:/data
      - bot-tmp:/data/tmp
      # yt-dlp writes refreshed cookies back, so this stays read-write.
      - ./cookies:/cookies
      - ./plugins:/plugins:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/tg-media-bot", "health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    # The bot itself needs ~10 MB; the rest is headroom for one yt-dlp +
    # ffmpeg run. If you raise MAX_PARALLEL_DOWNLOADS, raise this too.
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 20s
    logging: *logging

volumes:
  bot-data:
  bot-tmp:
  bot-api-data:
