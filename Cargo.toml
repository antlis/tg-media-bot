[package]
name = "tg-media-bot"
version = "1.0.6"
edition = "2021"
license = "MIT"
description = "Lightweight self-hosted Telegram media downloader bot (yt-dlp + ffmpeg)"

[dependencies]
# Runtime: async I/O glue with multi-thread worker pool for TLS/streaming/JSON.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "multipart", "stream", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { version = "0.4", features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
